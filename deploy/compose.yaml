name: printlab-bot-backend
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: printlab
      POSTGRES_USER: printlab
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U printlab -d printlab]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  slicer-proxy:
    image: nginxinc/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./slicer-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16777216
    networks: [default, existing-backend]
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 3s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  bot:
    image: ${BOT_IMAGE:?Set BOT_IMAGE to an immutable image reference}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    env_file: ./config/bot.env
    environment:
      DB_URL: jdbc:postgresql://db:5432/printlab
      DB_USER: printlab
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MODEL_STORAGE_DIR: /app/data/models
      SLICER_TRANSPORT: HTTP
      SLICER_BACKEND_URL: http://slicer-proxy:8080/api/print-plans/analyze-stl
      SLICER_ENABLED: "true"
      SLICER_VERSION: remote-api
      SLICER_TIMEOUT_SECONDS: "210"
      TARGET_PROFIT_MARKUP: "0.50"
      MINIMUM_PROFIT_MARKUP: "0.50"
    volumes:
      - bot-data:/app/data
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=134217728
    ports:
      - 127.0.0.1:8082:8082
    networks: [default, database]
    depends_on:
      db:
        condition: service_healthy
      slicer-proxy:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1
    stop_grace_period: 240s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  postgres-data:
  bot-data:
networks:
  default:
    name: printlab-bot-backend
  database:
    name: printlab-bot-backend-db
    internal: true
  existing-backend:
    external: true
    name: ${SLICER_DOCKER_NETWORK:-printlab_default}
