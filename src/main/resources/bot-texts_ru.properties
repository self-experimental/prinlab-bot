home=Привет!\nМы команда PrintLab и занимаемся 3D-печатью.\n\nДля печати нужен STL. Это файл с объёмной моделью будущей детали.\n\nМодель уже есть? Присылай STL, рассчитаем стоимость печати.\n\nМодели пока нет? Присылай фото или эскиз, желательно с точными размерами и требованиями. Обсудим детали и подготовим модель для печати.
button.print=Рассчитать печать по STL
button.model=Заказать модель по фото
button.orders=Мои заказы
button.contact=Связаться с нами
button.home=Назад в меню
button.help=Нужна помощь
upload.stl=Присылай STL-файл размером до 20 МБ. После загрузки выберем параметры и рассчитаем стоимость печати.\n\nДля автоматического расчёта подойдёт файл до 15 МБ. Если он больше, подключим оператора. Максимальный размер детали 180 × 180 × 180 мм.
consent=Чтобы обработать заявку, мы передадим фото, модель и описание нашим операторам.\n\nЦену согласуем с тобой до оплаты.
button.consent=Продолжить
upload.photo=Присылай фото или эскиз детали. Лучше несколько ракурсов, с точными размерами и описанием того, что нужно получить.\n\nМы посмотрим материалы, уточним детали и согласуем стоимость моделирования. Когда модель будет готова, сможем рассчитать её печать.
