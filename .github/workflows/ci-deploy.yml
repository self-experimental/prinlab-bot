name: CI and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    name: Tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: printlab_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: printlab-test-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d printlab_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B -ntp verify
      - name: PostgreSQL migration and workflow tests
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/printlab_test
          TEST_DATABASE_USER: postgres
          TEST_DATABASE_PASSWORD: printlab-test-only
        run: ./mvnw -B -ntp -Dtest=WorkflowTest,A1MiniPricingTest test
      - run: python3 -m unittest discover -s deploy/tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bot-jar
          path: target/app.jar
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Build container
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Publish immutable image
        id: image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io > /dev/null 2>&1' EXIT
          docker buildx create --use
          docker buildx build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --cache-from "type=registry,ref=$image:buildcache" \
            --cache-to "type=registry,ref=$image:buildcache,mode=max" \
            --metadata-file /tmp/bot-image.json --tag "$image:$GITHUB_SHA" --push .
          python3 -c 'import json; print("digest=" + json.load(open("/tmp/bot-image.json"))["containerimage.digest"])' >> "$GITHUB_OUTPUT"
  deploy:
    name: Deploy production
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Deploy and verify
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REGISTRY_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: python3 deploy/send-deploy.py "$IMAGE_DIGEST"
